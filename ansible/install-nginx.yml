---
- name: Install and configure Nginx on all web servers
  hosts: webservers
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Create custom index.html
      copy:
        content: |
          <html>
            <head><title>Ansible Lab</title></head>
            <body>
              <h1>Hello from {{ inventory_hostname }}</h1>
              <p>Hostname: {{ ansible_hostname }}</p>
              <p>Managed by Ansible</p>
            </body>
          </html>
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
      notify: Restart Nginx

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
